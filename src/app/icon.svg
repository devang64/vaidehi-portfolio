<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#v-grad)" filter="url(#shadow)" />
  <!-- Inner Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
  <!-- Monogram V Text -->
  <text 
    x="32" 
    y="44" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="36" 
    font-weight="900" 
    fill="#ffffff" 
    text-anchor="middle"
    style="font-style: italic;"
  >V</text>
</svg>
